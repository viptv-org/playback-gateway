[package]
name = "service-telemetry"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
http = "1"
bytes = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
zeroize = "1"
fs2 = "0.4"
axum = "0.7"
http-body = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
prost = "0.14"
opentelemetry-proto = { version = "0.33", features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures = "0.3"

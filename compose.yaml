services:
  gateway:
    build: .
    environment:
      API_KEY: ${API_KEY:?Set a unique bootstrap key of at least 32 characters}
      MAX_OUTPUTS: ${MAX_OUTPUTS:-8}
      LIVE_REPLAY_MAX_BYTES: ${LIVE_REPLAY_MAX_BYTES:-268435456}
      TORRENT_ENABLED: ${TORRENT_ENABLED:-false}
      TORRENT_PIECE_CACHE_BYTES: ${TORRENT_PIECE_CACHE_BYTES:-268435456}
      TORRENT_CACHE_MAX_BYTES: ${TORRENT_CACHE_MAX_BYTES:-2147483648}
      TORRENT_LISTEN_PORT: ${TORRENT_LISTEN_PORT:-}
      QSV_DEVICE: ${QSV_DEVICE:-}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-}
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-false}"
      NEW_RELIC_REGION: "${NEW_RELIC_REGION:-US}"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
      OBSERVABILITY_DAILY_BYTES: "${OBSERVABILITY_DAILY_BYTES:-10485760}"
      OBSERVABILITY_TRACE_SAMPLE_RATE: "${OBSERVABILITY_TRACE_SAMPLE_RATE:-0.1}"
      OBSERVABILITY_EXPORT_INTERVAL_SECONDS: "${OBSERVABILITY_EXPORT_INTERVAL_SECONDS:-30}"
      OBSERVABILITY_BUDGET_PATH: /var/lib/playback-gateway/observability-budget.json
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - gateway-data:/var/lib/playback-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
      - /var/lib/playback-gateway/media:size=${MEDIA_SPOOL_SIZE:-256m},uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
      - /var/lib/playback-gateway/torrent-cache:size=${TORRENT_SPOOL_SIZE:-2g},uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    stop_grace_period: 45s
volumes:
  gateway-data:

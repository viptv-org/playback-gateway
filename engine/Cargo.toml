[package]
name = "playback-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Managed, capability-addressed HLS playback engine: direct delivery, the managed ladder, probing and session leases. No database, no identity, no accounts."

[dev-dependencies]
tempfile = "3"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
futures = "0.3"
async-stream = "0.3"
sha2 = "0.10"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
